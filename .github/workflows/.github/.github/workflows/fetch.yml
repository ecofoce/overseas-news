name: fetch-overseas-news

on:
  schedule:
    - cron: '*/30 1-7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install feedparser
      - name: Fetch
        run: python fetch.py > news.json
      - name: Commit and push
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update news $(date -u +%FT%TZ)"
            git push
          fi
